[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "asynq-team-core"
version = "0.1.41"
description = "Local-first core runtime for Asynq Team."
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "SQLAlchemy>=2,<3",
]

[tool.poetry]
packages = [{ include = "asynq_team_core", from = "src" }]

[tool.poetry.group.dev.dependencies]
pip-audit = ">=2.7,<3"
pytest = ">=9.0.3,<10"
ruff = "==0.16.4"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
