[build-system]
requires = ["poetry-core>=1.9,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "asynq-team-core"
version = "0.1.0"
description = "Local-first core runtime for Asynq Team."
readme = "README.md"
packages = [{ include = "asynq_team_core", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4"
pydantic = ">=2.7,<3"
PyYAML = ">=6,<7"
SQLAlchemy = ">=2,<3"

[tool.poetry.group.dev.dependencies]
pip-audit = ">=2.7,<3"
pytest = ">=8,<9"
ruff = ">=0.6,<1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
